<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3e6c" />
      <stop offset="100%" stop-color="#0f1f38" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Outer Shield -->
  <path d="M50 5 L88 20 C88 58 50 92 50 92 C50 92 12 58 12 20 Z" fill="url(#shieldGrad)" stroke="#3b82f6" stroke-width="2"/>
  <!-- Inner Shield Border -->
  <path d="M50 12 L82 25 C82 55 50 84 50 84 C50 84 18 55 18 25 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8"/>
  <!-- Karnataka red-gold accent ribbon -->
  <path d="M30 45 Q50 40 70 45" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <path d="M30 48 Q50 43 70 48" stroke="#eab308" stroke-width="2" stroke-linecap="round"/>
  <!-- Central Star / Scale symbol -->
  <polygon points="50,22 53,30 62,31 55,37 57,46 50,41 43,46 45,37 38,31 47,30" fill="url(#goldGrad)"/>
  <!-- Scales of Justice / Balance bar -->
  <path d="M32 58 L68 58 M50 52 L50 74" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="68" cy="65" r="5" fill="#f59e0b"/>
  <path d="M32 58 L28 65 M32 58 L36 65" stroke="#ffffff" stroke-width="1"/>
  <path d="M68 58 L64 65 M68 58 L72 65" stroke="#ffffff" stroke-width="1"/>
</svg>
